[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in argument defaults is the framework's pattern
    "B904",  # raise ... from err: legacy code raises HTTPException inside except blocks
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slower tests (full-schema or end-to-end); run in CI on every PR, skipped with -m 'not slow' for a quick loop",
]
