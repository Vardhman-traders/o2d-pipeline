# Render Blueprint: creates the API web service. Secrets are entered in the Render dashboard.
services:
  - type: web
    name: vardhman-api
    runtime: python
    plan: starter         # paid plan: no idle sleep, more headroom for concurrent connections
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python migrate.py   # applies new migrations before each release; a failure stops the deploy
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false       # paste the Postgres *Internal* Database URL
      - key: JWT_SECRET
        sync: false       # paste a long random string
      - key: R2_ACCOUNT_ID
        sync: false       # Cloudflare R2 (order photos); leave blank to hide the photo boxes
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: DB_POOL_MAX
        value: "15"   # raised now that both services are on paid plans with more connection headroom
