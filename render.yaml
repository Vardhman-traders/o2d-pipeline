# Render Blueprint: creates the API web service. Secrets are entered in the Render dashboard.
services:
  - type: web
    name: vardhman-api
    runtime: python
    plan: starter         # paid plan: no idle sleep, more headroom for concurrent connections
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false       # paste the Postgres *Internal* Database URL
      - key: JWT_SECRET
        sync: false       # paste a long random string
      - key: APPS_SCRIPT_CLIENT_KEY
        sync: false       # paste a long random string; must exactly match the Apps Script
                          # project's "CLIENT_KEY" Script Property. Only the one deployment
                          # holding this value can read/write orders - see app/auth.py.
      - key: DB_POOL_MAX
        value: "15"   # raised now that both services are on paid plans with more connection headroom
