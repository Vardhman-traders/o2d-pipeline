  - id: O2D-GAP-1
    what: Clicking a missing number to enter it is an admin-switched page, and duplicates are still refused
    speed: fast
    tests: [tests/test_o2d_features.py::test_missing_number_entry_is_a_page_the_admin_switches_on]
  - id: O2D-PHOTO-1
    what: Order photos (R2) - off until configured, role/page gated, follow order visibility, capped per order
    speed: fast
