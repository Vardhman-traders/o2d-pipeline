# Maps behaviours/findings to the tests that protect them, so "is X covered?" has one answer.
# speed: fast = runs in the quick loop, slow = full-schema/end-to-end (still runs on every PR).
# Add an entry whenever a finding (F1-F25 in the migration plan) or a business rule gets a test.
entries:
  - id: MIG-1
    what: Every migration applies to an empty database
    speed: fast
    tests: [tests/test_migrations.py::test_all_migrations_recorded]
  - id: MIG-2
    what: Re-running migrations changes nothing
    speed: fast
    tests: [tests/test_migrations.py::test_rerun_is_a_noop]
  - id: MIG-3
    what: An already-applied migration cannot be edited
    speed: slow
    tests: [tests/test_migrations.py::test_editing_an_applied_migration_is_refused]
  - id: MIG-4
    what: A failing migration rolls back completely
    speed: slow
    tests: [tests/test_migrations.py::test_failed_migration_rolls_back_and_is_not_recorded]
  - id: O2D-AUTH-1
    what: Login issues a token and forces a password change on first login
    speed: fast
    tests:
      - tests/test_api_smoke.py::test_login_returns_token_and_forces_password_change
      - tests/test_api_smoke.py::test_user_must_change_password_before_reading_orders
  - id: O2D-AUTH-2
    what: Orders need a token; wrong passwords are rejected
    speed: fast
    tests:
      - tests/test_api_smoke.py::test_orders_require_a_token
      - tests/test_api_smoke.py::test_wrong_password_is_rejected
  - id: O2D-ROLE-1
    what: Role-based access to the orders list (shop, admin, cashier, unknown role)
    speed: fast
    tests:
      - tests/test_api_smoke.py::test_shop_user_can_list_orders_after_password_set
      - tests/test_api_smoke.py::test_admin_can_list_orders
      - tests/test_api_smoke.py::test_cashier_can_open_list_but_sees_no_orders_by_default
      - tests/test_api_smoke.py::test_unknown_role_is_forbidden
  - id: O2D-SCREENS-1
    what: Order lifecycle works end to end through the Python routes that replace Apps Script (shop, godown, dispatch, receiving)
    speed: slow
    tests: [tests/test_o2d_screens.py::test_order_lifecycle_across_role_screens]
  - id: O2D-SCREENS-2
    what: WhatsApp dispatch alert sends once on first fill, never re-sends, and never fails the save
    speed: fast
    tests:
      - tests/test_o2d_screens.py::test_order_lifecycle_across_role_screens
      - tests/test_o2d_screens.py::test_alert_failure_never_fails_the_save
      - tests/test_o2d_screens.py::test_whatsapp_message_and_skip_without_credentials
  - id: O2D-SCREENS-3
    what: Dashboard date window skips Monday; missing challan/invoice number detection
    speed: fast
    tests:
      - tests/test_o2d_screens.py::test_dashboard_window_skips_monday
      - tests/test_o2d_screens.py::test_gap_helpers
      - tests/test_o2d_screens.py::test_missing_numbers_challans_and_invoices
  - id: O2D-ROLE-2
    what: Admin sees and edits every order; cashier view is an admin toggle (view only, default off)
    speed: fast
    tests:
      - tests/test_o2d_screens.py::test_admin_sees_orders_and_cashier_view_is_a_toggle
      - tests/test_o2d_screens.py::test_admin_sees_and_edits_any_order
      - tests/test_o2d_screens.py::test_admin_only_routes
  - id: O2D-VALID-1
    what: Friendly validation messages and role field permissions still enforced through the new routes
    speed: fast
    tests:
      - tests/test_o2d_screens.py::test_validation_messages
      - tests/test_o2d_screens.py::test_role_field_permissions_still_enforced
  - id: O2D-UI-1
    what: One order travels through the real shop, godown, dispatch and receiving pages in a browser, no script errors
    speed: slow
    tests: [tests/test_sales_ui.py::test_one_order_through_every_role_screen]
  - id: NOAPPS-1
    what: No Apps Script or Google Sheets dependency remains (client key, SSO ticket, security screen, Google links)
    speed: fast
    tests:
      - tests/test_apps_script_removed.py::test_no_client_key_needed_and_old_variable_ignored
      - tests/test_apps_script_removed.py::test_apps_script_hooks_are_gone
      - tests/test_apps_script_removed.py::test_no_apps_script_or_google_sheets_left_in_the_app
  - id: NOAPPS-2
    what: The /sales/ page, its own CSP, the seeded Sales Portal link and safe own-page links
    speed: fast
    tests:
      - tests/test_apps_script_removed.py::test_sales_page_is_served_with_its_own_csp_and_others_stay_strict
      - tests/test_apps_script_removed.py::test_sales_portal_link_is_seeded_for_operating_roles
      - tests/test_apps_script_removed.py::test_admin_can_add_links_to_own_pages_but_not_unsafe_ones
      - tests/test_apps_script_removed.py::test_database_rejects_unsafe_link_urls
  - id: ADMIN-FILTER-1
    what: Order filters (multi-value, dates, amounts, text, stage), sorting/paging, injection-proof, saved filters, Excel export
    speed: fast
    tests:
      - tests/test_admin_tools.py::test_filters_sorting_paging_and_stage_logic
      - tests/test_admin_tools.py::test_filter_options_and_sql_injection_is_inert
      - tests/test_admin_tools.py::test_saved_filters
      - tests/test_admin_tools.py::test_filtered_excel_export
  - id: ADMIN-BULK-1
    what: Bulk upload of orders - template, every validation message, re-check, all-or-nothing import, undo rules
    speed: fast
    tests:
      - tests/test_admin_tools.py::test_template_and_admin_only
      - tests/test_admin_tools.py::test_template_and_admin_only
      - tests/test_admin_tools.py::test_template_round_trips_and_examples_are_ignored
      - tests/test_admin_tools.py::test_valid_rows_and_all_the_error_messages
      - tests/test_admin_tools.py::test_wrong_file_and_excel_upload
      - tests/test_admin_tools.py::test_existing_order_is_flagged_and_row_cap
      - tests/test_admin_tools.py::test_revalidate_lets_you_fix_a_row_without_reuploading
      - tests/test_admin_tools.py::test_import_creates_orders_with_batch_and_can_be_undone
      - tests/test_admin_tools.py::test_undo_is_refused_once_an_imported_order_was_edited
      - tests/test_admin_tools.py::test_confirm_is_all_or_nothing
  - id: ADMIN-BULK-2
    what: Bulk member creation (roles limited, generated passwords, first-login change, undo only if unused)
    speed: fast
    tests:
      - tests/test_admin_tools.py::test_bulk_members_validate_import_login_and_undo
      - tests/test_admin_tools.py::test_bulk_members_undo_when_nobody_signed_in
  - id: ADMIN-UI-1
    what: Admin portal in a real browser - bulk upload with inline fix, filters, saved filter, export, undo, bulk members
    speed: slow
    tests: [tests/test_admin_ui.py::test_admin_filters_bulk_upload_and_undo]
